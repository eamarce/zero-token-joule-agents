<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agent</title>
  <!-- Sets window["sap-ui-config"] (theme) and the content density class. External file: no inline script. -->
  <link rel="stylesheet" href="css/style.css" />
  <script src="init.js"></script>
  <script
    id="sap-ui-bootstrap"
    src="https://ui5.sap.com/1.136.20/resources/sap-ui-core.js"
    data-sap-ui-async="true"
    data-sap-ui-compat-version="edge"
    data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    data-sap-ui-resource-roots='{"zt.agent": "./"}'
  ></script>
</head>
<body class="sapUiBody" id="content">
  <div
    data-sap-ui-component
    data-name="zt.agent"
    data-id="container"
    data-settings='{"id": "agent"}'
    data-handle-validation="true"
    data-height="100%"
  ></div>
</body>
</html>
