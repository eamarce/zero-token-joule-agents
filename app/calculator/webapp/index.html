<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Opportunity calculator</title>
		<link rel="stylesheet" href="css/style.css" />
		<script src="config.js"></script>
		<script
			id="sap-ui-bootstrap"
			src="https://ui5.sap.com/1.136.20/resources/sap-ui-core.js"
			data-sap-ui-async="true"
			data-sap-ui-xx-component-preload="off"
			data-sap-ui-compat-version="edge"
			data-sap-ui-resource-roots='{ "zt.calculator": "./" }'
			data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
		></script>
	</head>
	<body class="sapUiBody" id="content">
		<div
			data-sap-ui-component
			data-name="zt.calculator"
			data-id="container"
			data-height="100%"
			data-settings='{"id": "calculator"}'
			data-handle-validation="true"
		></div>
	</body>
</html>
