<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Joule (A2A) console</title>
    <!-- Sets the Quartz theme (light or dark) before the UI5 bootstrap reads its configuration. -->
    <script src="theme.js"></script>
    <script
      id="sap-ui-bootstrap"
      src="https://ui5.sap.com/1.136.20/resources/sap-ui-core.js"
      data-sap-ui-libs="sap.m"
      data-sap-ui-compat-version="edge"
      data-sap-ui-async="true"
      data-sap-ui-resource-roots='{"zt.joule": "./"}'
      data-sap-ui-on-init="module:sap/ui/core/ComponentSupport"
    ></script>
  </head>
  <body class="sapUiBody" id="content">
    <div
      data-sap-ui-component
      data-name="zt.joule"
      data-id="container"
      data-height="100%"
      data-settings='{"id": "joule"}'
      data-handle-validation="true"
    ></div>
  </body>
</html>
